<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#F4F6F9;
  --ink:#131C26; --ink-2:#475565; --ink-3:#7A8694; --line:#D3DAE2;
  --accent:#2747D4; --accent-ink:#FFFFFF;
  --work:#0A7F8A; --need:#B56500; --review:#6E44C4; --done:#27824A; --fail:#C4372F; --idle:#7A8694;
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E141B; --surface:#161E28; --surface-2:#1B2531;
    --ink:#E6ECF2; --ink-2:#A9B5C2; --ink-3:#74808E; --line:#2A3644;
    --accent:#8AA0FF; --accent-ink:#0B1020;
    --work:#3FC2CC; --need:#F0A93B; --review:#B497F4; --done:#5CC480; --fail:#F0736A; --idle:#74808E;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
code,pre,.mono{font-family:var(--mono)}
a{color:var(--accent)}

.bar{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.bar .name{font-family:var(--display);font-weight:700;font-size:1.1rem}
.bar select{border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:5px 8px;font-weight:600;max-width:240px}
.bar .counts{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.conn{font-family:var(--mono);font-size:.7rem;color:var(--fail)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.s-need{--c:var(--need)} .s-review{--c:var(--review)} .s-work{--c:var(--work)} .s-failed{--c:var(--fail)} .s-idle{--c:var(--idle)}
.s-work .dot{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.s-work .dot{animation:none}}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:.8125rem;padding:5px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--fail)}
.btn.sm{padding:3px 9px;font-size:.75rem}

.body{flex:1;min-height:0;display:grid;grid-template-columns:250px minmax(0,1fr)}
.rail{border-right:1px solid var(--line);overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:2px;background:var(--surface-2)}
.rail .grp{font-family:var(--mono);font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:10px 8px 4px}
.rail .empty{padding:14px 8px;color:var(--ink-3);font-size:.8rem}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:2px 8px;width:100%;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:7px;cursor:pointer}
.row:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.row[aria-current="true"]{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.row .cs{font-family:var(--mono);font-weight:600;font-size:.8125rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ago{font-size:.7rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.row .last{grid-column:2 / 4;font-size:.75rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ctx{grid-column:2 / 4}
.ctx{--m:var(--ink-3);display:block;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.ctx i{display:block;height:100%;background:var(--m);border-radius:2px}
.ctx-warn{--m:var(--need)} .ctx-high{--m:var(--fail)}
.chip{--m:var(--ink-2);display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--m);font-family:var(--mono);font-size:.72rem;font-weight:600;padding:4px 9px;border-radius:7px;cursor:pointer;white-space:nowrap}
.chip .ctx{width:44px}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surface)}
.head{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding:9px 16px;border-bottom:1px solid var(--line)}
.head .cs{font-family:var(--mono);font-weight:600;font-size:1rem;cursor:pointer}
.head .meta{font-family:var(--mono);font-size:.72rem;color:var(--ink-3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.head select{border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:3px 6px;font-size:.75rem}
.ctxpanel{border-bottom:1px solid var(--line);background:var(--surface-2);padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.stack{display:flex;height:12px;border-radius:4px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.75rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:2px;display:block}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctxpanel input{flex:1 1 220px;min-width:0;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:4px 8px;font-size:.8rem}

.thread{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:min(760px,94%);min-width:0}
.msg.user{align-self:flex-end;background:var(--surface-2);border:1px solid var(--line);border-radius:12px 12px 2px 12px;padding:9px 12px;display:flex;flex-direction:column;gap:8px;white-space:pre-wrap;word-break:break-word}
.msg.user .imgs{display:flex;gap:6px;flex-wrap:wrap}
.msg.user img{max-width:220px;max-height:160px;border:1px solid var(--line);border-radius:6px;cursor:zoom-in;display:block}
.msg.user img.big{max-width:100%;max-height:none;cursor:zoom-out}
.msg.ai{align-self:flex-start;word-break:break-word}
.md > :first-child{margin-top:0} .md > :last-child{margin-bottom:0}
.md p{margin:.5em 0} .md ul,.md ol{margin:.5em 0;padding-left:1.4em} .md li{margin:.15em 0}
.md h3,.md h4,.md h5,.md h6{font-family:var(--display);margin:.9em 0 .3em;line-height:1.2}
.md h3{font-size:1.15rem} .md h4{font-size:1.05rem} .md h5,.md h6{font-size:.95rem}
.md code{font-size:.85em;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.md pre{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;margin:.6em 0}
.md pre code{background:none;border:0;padding:0;font-size:.8rem}
.md .tbl{overflow-x:auto;margin:.6em 0}
.md table{border-collapse:collapse;font-size:.85rem}
.md th,.md td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.md th{background:var(--surface-2)}
details.tool{align-self:flex-start;max-width:100%;min-width:0;font-family:var(--mono);font-size:.75rem;color:var(--ink-2);border-left:2px solid var(--line);padding:2px 9px}
details.tool summary{cursor:pointer;display:flex;gap:8px;align-items:baseline;list-style:none;min-width:0}
details.tool summary::-webkit-details-marker{display:none}
details.tool b{color:var(--ink);font-weight:600;flex:none}
details.tool .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
details.tool .r{flex:none;color:var(--ink-3)}
details.tool .r.err{color:var(--fail)} details.tool .r.run{color:var(--work)}
details.tool pre{margin:6px 0;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto;color:var(--ink)}
.card{align-self:flex-start;max-width:min(680px,100%);border:1px solid color-mix(in srgb,var(--need) 55%,var(--line));background:color-mix(in srgb,var(--need) 8%,var(--surface));border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .k{font-family:var(--mono);font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--need);font-weight:600}
.card pre{margin:0;font-family:var(--mono);font-size:.8rem;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
.card .q{font-weight:600}
.card .opts{display:flex;flex-direction:column;gap:6px}
.card .opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.card .opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card .opt small{color:var(--ink-2)}
.card input[type=text]{border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:6px 9px;width:100%}
.note{align-self:flex-start;font-family:var(--mono);font-size:.72rem;color:var(--ink-3);padding:3px 9px;border-left:2px solid var(--line);word-break:break-word}
.typing{display:flex;align-items:center;gap:8px;color:var(--work);font-size:.8rem;font-weight:500;padding:0 16px 8px}

.composer{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px;position:relative}
.composer .line{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:9px 10px;min-height:40px;max-height:220px}
.composer.drag textarea{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.attach{display:flex;gap:6px;flex-wrap:wrap}
.attach .th{position:relative}
.attach img{width:56px;height:56px;object-fit:cover;border:1px solid var(--line);border-radius:6px;display:block}
.attach button{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:11px;line-height:1;cursor:pointer;padding:0}
.hint{font-size:.7rem;color:var(--ink-3)}
.cmds{position:absolute;left:12px;right:12px;bottom:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgb(0 0 0 / .18);max-height:240px;overflow:auto;padding:4px;z-index:5}
.cmds button{display:block;width:100%;text-align:left;border:0;background:transparent;font-family:var(--mono);font-size:.8rem;padding:5px 8px;border-radius:5px;cursor:pointer}
.cmds button:hover,.cmds button.on{background:var(--surface-2)}

.pane{flex:1;overflow-y:auto;padding:22px 20px;background:var(--surface-2);display:flex;flex-direction:column;gap:14px}
.pane h2{margin:0;font-family:var(--display);font-size:1.3rem}
.pane .sub{color:var(--ink-2);max-width:70ch}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;max-width:860px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:.75rem;font-weight:600;color:var(--ink-2);min-width:0}
.form input[type=text],.form select,.form textarea,.find{border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:7px 9px;min-width:0;width:100%;font-weight:400;color:var(--ink)}
.form .wide{grid-column:1 / -1}
.form .fixed{font-family:var(--mono);font-size:.8rem;font-weight:500;color:var(--ink);padding:7px 0}
.err{color:var(--fail);font-weight:600}
.list{display:flex;flex-direction:column;gap:6px;max-width:860px}
.it{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.it .what{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:2px}
.it .what b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .what span{font-size:.75rem;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .when{font-family:var(--mono);font-size:.72rem;color:var(--ink-3);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.85rem;z-index:20;max-width:90vw}

@media (max-width:760px){
  .body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .rail .grp{display:none}
  .row{width:auto;flex:none;grid-template-columns:auto auto;box-shadow:0 0 0 1px var(--line)}
  .row .last,.row .ago,.row .ctx{display:none}
  .row .cs{max-width:140px}
}
</style>
</head>
<body>
<div class="bar">
  <span class="name">Cockpit</span>
  <select id="project" aria-label="Project"></select>
  <button class="btn sm" id="btn-project" type="button">+ Project</button>
  <span class="counts" id="counts"></span>
  <span class="conn" id="conn" hidden>reconnecting…</span>
  <button class="btn sm" id="btn-notify" type="button" hidden>Notify me</button>
  <button class="btn" id="btn-resume" type="button">Resume session</button>
  <button class="btn primary" id="btn-new" type="button">+ New agent</button>
</div>
<div class="body">
  <nav class="rail" id="rail" aria-label="Agents"></nav>
  <div class="main" id="main"></div>
</div>

<script>
'use strict';
const ST = { need: 'Needs you', review: 'Ready to review', work: 'Working', failed: 'Failed', idle: 'Idle' };
const ORDER = ['need', 'review', 'work', 'failed', 'idle'];
const MODES = { default: 'Ask before edits and commands', acceptEdits: 'Accept edits, ask for commands', plan: 'Plan first, change nothing' };
const KCOL = ['var(--ink-2)', 'var(--review)', 'var(--work)', 'var(--need)', 'var(--done)', 'var(--ink-3)', 'var(--fail)'];

const S = { projects: [], agents: new Map(), items: new Map(), commands: new Map(), project: null, cur: null, view: 'chat',
  drafts: new Map(), attach: [], ctxOpen: false, ctx: new Map(), home: '' };
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

function h(tag, a, ...kids) {
  const e = document.createElement(tag);
  if (a) for (const [k, v] of Object.entries(a)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'hidden' || k === 'selected' || k === 'type' || k === 'id' || k === 'title' || k === 'placeholder' || k === 'rows' || k === 'open') e[k] = v;
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}
const $ = id => document.getElementById(id);
function toast(msg) { const t = h('div', { class: 'toast', text: msg }); document.body.append(t); setTimeout(() => t.remove(), 4200); }
async function api(method, url, body) {
  const res = await fetch(url, { method, headers: body ? { 'content-type': 'application/json' } : undefined, body: body ? JSON.stringify(body) : undefined });
  let data = {}; try { data = await res.json(); } catch {}
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}
function ago(ts) {
  if (!ts) return '';
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 45) return 'now'; if (s < 3600) return Math.round(s / 60) + ' min'; if (s < 86400) return Math.round(s / 3600) + ' h';
  return Math.round(s / 86400) + ' d';
}
function lvl(p) { return p >= 80 ? ' ctx-high' : p >= 60 ? ' ctx-warn' : ''; }
function meter(p) { return h('span', { class: 'ctx' + lvl(p), title: `Context ${p}%` }, h('i', { style: `width:${Math.min(100, p)}%` })); }
function pill(st, text) { return h('span', { class: 'pill s-' + st }, h('span', { class: 'dot' }), text || ST[st]); }
function teamOf(pid) { return [...S.agents.values()].filter(a => a.projectId === pid); }
function curAgent() { return S.agents.get(S.cur) || null; }
function curProject() { return S.projects.find(p => p.id === S.project) || null; }

// ───────── small, safe Markdown renderer ─────────
function md(src) {
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const inline = s => {
    s = esc(s); const codes = [];
    s = s.replace(/`([^`\n]+)`/g, (m, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[\s(])\*([^*\s][^*\n]*)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>');
    s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return s.replace(/\u0000(\d+)\u0000/g, (m, i) => '<code>' + codes[i] + '</code>');
  };
  const isList = l => /^\s*([-*]|\d+\.)\s+/.test(l), isRow = l => /^\s*\|.*\|\s*$/.test(l);
  const out = []; const lines = src.replace(/\r/g, '').split('\n'); let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^\s*```/.test(l)) { const buf = []; i++; while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]); i++; out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); continue; }
    const hd = /^(#{1,4})\s+(.*)$/.exec(l);
    if (hd) { const n = hd[1].length + 2; out.push(`<h${n}>${inline(hd[2])}</h${n}>`); i++; continue; }
    if (isRow(l) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => inline(c.trim()));
      const head = cells(l); i += 2; const rows = [];
      while (i < lines.length && isRow(lines[i])) rows.push(cells(lines[i++]));
      out.push('<div class="tbl"><table><thead><tr>' + head.map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>');
      continue;
    }
    if (isList(l)) {
      const ord = /^\s*\d+\./.test(l); const buf = [];
      while (i < lines.length && (isList(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && buf.length))) {
        if (isList(lines[i])) buf.push(inline(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, ''))); else buf[buf.length - 1] += '<br>' + inline(lines[i].trim());
        i++;
      }
      out.push((ord ? '<ol>' : '<ul>') + buf.map(b => `<li>${b}</li>`).join('') + (ord ? '</ol>' : '</ul>')); continue;
    }
    if (!l.trim()) { i++; continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^\s*```/.test(lines[i]) && !/^#{1,4}\s/.test(lines[i]) && !isList(lines[i])) buf.push(inline(lines[i++]));
    out.push('<p>' + buf.join('<br>') + '</p>');
  }
  return out.join('');
}

// ───────── top bar and roster ─────────
function renderBar() {
  const sel = $('project'); sel.textContent = '';
  if (!S.projects.length) sel.append(h('option', { text: 'No project yet', value: '' }));
  for (const p of S.projects) {
    const need = teamOf(p.id).filter(a => a.status === 'need').length;
    sel.append(h('option', { value: p.id, text: p.name + (need ? `  (${need} need you)` : ''), selected: p.id === S.project }));
  }
  const counts = $('counts'); counts.textContent = '';
  const team = teamOf(S.project);
  for (const s of ORDER) { const n = team.filter(a => a.status === s).length; if (n) counts.append(pill(s, `${n} ${ST[s].toLowerCase()}`)); }
  $('btn-new').disabled = $('btn-resume').disabled = !S.project;

  api('GET', `/api/sessions?projectId=${p.id}&limit=200`).then(d => { sessions = d.sessions; paint(); }).catch(x => { list.textContent = ''; list.append(h('span', { class: 'err', text: x.message })); });
  return h('div', { class: 'pane' }, h('h2', { text: 'Resume a session' }),
    h('span', { class: 'sub', text: `Previous Claude Code sessions recorded in ${p.cwd}. A resumed session becomes an agent in this project and continues with its full history. Close it in the terminal first: a session should be driven from one place at a time.` }),
    find, list, h('div', { class: 'acts' }, h('button', { class: 'btn', type: 'button', text: 'Back', onclick: () => go('chat') })));
}
function viewProject() {
  const err = h('span', { class: 'err wide' });
  const name = h('input', { type: 'text', id: 'proj-name', placeholder: 'for example Wiki', autocomplete: 'off' });
  const cwd = h('input', { type: 'text', id: 'proj-cwd', placeholder: 'D:\\projects\\wiki   or   ~/projects/wiki', autocomplete: 'off', spellcheck: 'false' });
  const note = h('textarea', { id: 'proj-note', rows: 3, placeholder: 'Optional. Notes every agent in this project receives, for example the goal and the rules of the team.' });
  const create = async body => {
    err.textContent = '';
    try { const d = await api('POST', '/api/projects', body); if (!S.projects.find(x => x.id === d.project.id)) S.projects.push(d.project); selectProject(d.project.id, teamOf(d.project.id).length ? 'chat' : 'resume'); }
    catch (x) { err.textContent = x.message; }
  };
  const form = h('form', { class: 'form', onsubmit: e => { e.preventDefault(); create({ name: name.value, cwd: cwd.value, note: note.value }); } },
    h('label', null, 'Project name', name), h('label', null, 'Project folder', cwd), h('label', { class: 'wide' }, 'Team notes', note), err,
    h('div', { class: 'acts wide' }, h('button', { class: 'btn primary', type: 'submit', text: 'Create project' }), S.projects.length ? h('button', { class: 'btn', type: 'button', text: 'Cancel', onclick: () => go('chat') }) : null));
  const sug = h('div', { class: 'list' });
  api('GET', '/api/folders').then(d => {
    if (!d.folders.length) return;
    sug.append(h('span', { class: 'sub', text: 'Folders where you already used Claude Code. One click makes it a project.' }));
    for (const f of d.folders) sug.append(h('div', { class: 'it' }, h('div', { class: 'what' }, h('b', { class: 'mono', text: f.short }), h('span', { text: `${f.sessions} session${f.sessions === 1 ? '' : 's'}` })),
      h('span', { class: 'when', text: 'last used ' + ago(f.last) + (ago(f.last) === 'now' ? '' : ' ago') }),
      h('button', { class: 'btn sm', type: 'button', text: 'Use as project', onclick: () => create({ cwd: f.path }) })));
  }).catch(() => {});
  return h('div', { class: 'pane' }, h('h2', { text: S.projects.length ? 'New project' : 'Create your first project' }),
    h('span', { class: 'sub', text: 'A project is a folder and the team of agents that works in it. Every agent of the project starts in that folder, and its sessions are stored and resumed there.' }),
    form, sug);
}
function go(view) { S.view = view; renderRail(); renderMain(); }
function selectProject(id, view) {
  S.project = id; store.set('cockpit.project', id || '');
  const team = teamOf(id); const remembered = store.get('cockpit.agent.' + id);
  S.cur = team.find(a => a.id === remembered)?.id || team.sort((x, y) => ORDER.indexOf(x.status) - ORDER.indexOf(y.status))[0]?.id || null;
  S.view = view || 'chat'; S.attach = []; S.ctxOpen = false;
  renderBar(); renderRail(); renderMain();
}

// ───────── live updates ─────────
function onAgent(a) {
  const before = S.agents.get(a.id); S.agents.set(a.id, a);
  if (before && before.status !== a.status && (a.status === 'need' || (a.status === 'review' && before.status === 'work')) && document.hidden && 'Notification' in window && Notification.permission === 'granted') {
    try { new Notification(`${a.name} · ${ST[a.status]}`, { body: a.last || '', tag: a.id }); } catch {}
  }
  renderBar(); renderRail();
  if (a.id === S.cur && S.view === 'chat') { if (!els.head) renderMain(); else renderHead(); }
}
async function sync() {
  const d = await api('GET', '/api/state');
  S.projects = d.projects; S.home = d.home; S.agents = new Map(d.agents.map(a => [a.id, a])); S.items.clear();
  const want = S.project || store.get('cockpit.project');
  selectProject(S.projects.find(p => p.id === want)?.id || S.projects[0]?.id || null, S.projects.length ? (S.view === 'project' ? 'chat' : S.view) : 'project');
}
function connect() {
  const es = new EventSource('/api/events');
  es.onopen = () => { $('conn').hidden = true; sync().catch(e => toast(e.message)); };
  es.onerror = () => { $('conn').hidden = false; };
  es.onmessage = m => {
    const ev = JSON.parse(m.data);
    if (ev.t === 'agent') onAgent(ev.agent);
    else if (ev.t === 'item') upsertItem(ev.agentId, ev.item);
    else if (ev.t === 'delta') onDelta(ev.agentId, ev.id, ev.text);
    else if (ev.t === 'commands') S.commands.set(ev.agentId, ev.commands);
    else if (ev.t === 'remove') { S.agents.delete(ev.agentId); S.items.delete(ev.agentId); if (S.cur === ev.agentId) selectProject(S.project); else { renderBar(); renderRail(); } }
    else if (ev.t === 'project') { const i = S.projects.findIndex(p => p.id === ev.project.id); if (i >= 0) S.projects[i] = ev.project; else S.projects.push(ev.project); renderBar(); }
    else if (ev.t === 'projectRemove') { S.projects = S.projects.filter(p => p.id !== ev.projectId); if (S.project === ev.projectId) selectProject(S.projects[0]?.id || null, S.projects.length ? 'chat' : 'project'); else renderBar(); }
  };
}
$('project').addEventListener('change', e => selectProject(e.target.value));
$('btn-project').addEventListener('click', () => go('project'));
$('btn-new').addEventListener('click', () => go('new'));
$('btn-resume').addEventListener('click', () => go('resume'));
$('btn-notify').addEventListener('click', () => Notification.requestPermission().then(renderBar));
setInterval(renderRail, 30000);
connect();
</script>
</body>
</html>
