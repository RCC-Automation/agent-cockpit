<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#F4F6F9;
  --ink:#131C26; --ink-2:#475565; --ink-3:#7A8694; --line:#D3DAE2;
  --accent:#2747D4; --accent-ink:#FFFFFF;
  --work:#0A7F8A; --need:#B56500; --review:#6E44C4; --done:#27824A; --fail:#C4372F; --idle:#7A8694;
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
/* Themes: "system" sets no attribute and follows the PC; the others are chosen in the Look menu. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --bg:#0E141B; --surface:#161E28; --surface-2:#1B2531;
    --ink:#E6ECF2; --ink-2:#A9B5C2; --ink-3:#74808E; --line:#2A3644;
    --accent:#8AA0FF; --accent-ink:#0B1020;
    --work:#3FC2CC; --need:#F0A93B; --review:#B497F4; --done:#5CC480; --fail:#F0736A; --idle:#74808E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#161E28; --surface-2:#1B2531;
  --ink:#E6ECF2; --ink-2:#A9B5C2; --ink-3:#74808E; --line:#2A3644;
  --accent:#8AA0FF; --accent-ink:#0B1020;
  --work:#3FC2CC; --need:#F0A93B; --review:#B497F4; --done:#5CC480; --fail:#F0736A; --idle:#74808E;
  color-scheme:dark;
}
:root[data-theme="midnight"]{
  --bg:#000000; --surface:#0B0B0C; --surface-2:#141416;
  --ink:#F4F4F5; --ink-2:#BDBDC2; --ink-3:#85858C; --line:#2B2B30;
  --accent:#7FB0FF; --accent-ink:#001230;
  --work:#4FD0DA; --need:#FFB84D; --review:#C3A6FF; --done:#6AD48E; --fail:#FF8278; --idle:#85858C;
  color-scheme:dark;
}
:root[data-theme="paper"]{
  --bg:#EFEADF; --surface:#FBF8F1; --surface-2:#F3EEE3;
  --ink:#2A251C; --ink-2:#5C5445; --ink-3:#8A806D; --line:#DAD2BF;
  --accent:#1F5FA8; --accent-ink:#FFFFFF;
  --work:#0C7480; --need:#A85C00; --review:#6540B8; --done:#2A7A46; --fail:#B8342C; --idle:#8A806D;
  color-scheme:light;
}
:root[data-theme="contrast"]{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F2F2F2;
  --ink:#000000; --ink-2:#262626; --ink-3:#4D4D4D; --line:#8C8C8C;
  --accent:#0033CC; --accent-ink:#FFFFFF;
  --work:#005F6B; --need:#8A4B00; --review:#4B2A9E; --done:#1B5E33; --fail:#A31D16; --idle:#4D4D4D;
  color-scheme:light;
}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--scale, 1))}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:.875rem;line-height:1.5;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
code,pre,.mono{font-family:var(--mono)}
a{color:var(--accent)}

.bar{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.bar .name{font-family:var(--display);font-weight:700;font-size:1.1rem}
.bar select{border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:5px 8px;font-weight:600;max-width:240px}
.bar .counts{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.conn{font-family:var(--mono);font-size:.7rem;color:var(--fail)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.s-need{--c:var(--need)} .s-review{--c:var(--review)} .s-work{--c:var(--work)} .s-failed{--c:var(--fail)} .s-idle{--c:var(--idle)}
.s-work .dot{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.s-work .dot{animation:none}}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:.8125rem;padding:5px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--fail)}
.btn.sm{padding:3px 9px;font-size:.75rem}

.body{flex:1;min-height:0;display:grid;grid-template-columns:250px minmax(0,1fr)}
.rail{border-right:1px solid var(--line);overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:2px;background:var(--surface-2)}
.rail .grp{font-family:var(--mono);font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:10px 8px 4px}
.rail .empty{padding:14px 8px;color:var(--ink-3);font-size:.8rem}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:2px 8px;width:100%;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:7px;cursor:pointer}
.row:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.row[aria-current="true"]{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.row .cs{font-family:var(--mono);font-weight:600;font-size:.8125rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ago{font-size:.7rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.row .last{grid-column:2 / 4;font-size:.75rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ctx{grid-column:2 / 4}
.ctx{--m:var(--ink-3);display:block;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.ctx i{display:block;height:100%;background:var(--m);border-radius:2px}
.ctx-warn{--m:var(--need)} .ctx-high{--m:var(--fail)}
.chip{--m:var(--ink-2);display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--m);font-family:var(--mono);font-size:.72rem;font-weight:600;padding:4px 9px;border-radius:7px;cursor:pointer;white-space:nowrap}
.chip .ctx{width:44px}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surface);position:relative}
.look{position:fixed;right:14px;top:50px;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgb(0 0 0 / .22);padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:240px}
.look label{display:flex;flex-direction:column;gap:5px;font-size:.75rem;font-weight:600;color:var(--ink-2)}
.look select{border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:5px 8px}
.look .size{display:flex;align-items:center;gap:8px}
.look .size span{flex:1;text-align:center;font-family:var(--mono);font-size:.8rem;color:var(--ink)}
.preview{position:absolute;top:0;right:0;bottom:0;width:min(58%,900px);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgb(0 0 0 / .16);display:flex;flex-direction:column;z-index:6}
.pv-head{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:.8rem}
.pv-head b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono)}
.pv-head a{white-space:nowrap}
.pv-body{flex:1;min-height:0;display:flex;background:var(--surface-2);overflow:auto}
.pv-body iframe{flex:1;border:0;background:#FFFFFF;width:100%}
.pv-body img,.pv-body video{max-width:100%;max-height:100%;margin:auto;object-fit:contain}
.pv-body audio{margin:auto}
.pv-text{padding:16px 18px;flex:1;min-width:0}
.pv-text pre{white-space:pre-wrap;word-break:break-word;margin:0;font-size:.8rem}
.files{align-self:flex-start;display:flex;flex-wrap:wrap;gap:8px;max-width:100%}
.file{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 12px 8px 8px;max-width:440px;min-width:0;cursor:pointer}
.file:hover{border-color:var(--accent)}
.file img{width:72px;height:54px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:none;background:var(--surface-2)}
.file > div{min-width:0;display:flex;flex-direction:column;gap:1px}
.file .k{font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.file .tt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .nt{font-size:.75rem;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:760px){.preview{width:100%}}
.head{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding:9px 16px;border-bottom:1px solid var(--line)}
.head .cs{font-family:var(--mono);font-weight:600;font-size:1rem;cursor:pointer}
.head .meta{font-family:var(--mono);font-size:.72rem;color:var(--ink-3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.head select{border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:3px 6px;font-size:.75rem}
.ctxpanel{border-bottom:1px solid var(--line);background:var(--surface-2);padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.stack{display:flex;height:12px;border-radius:4px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.75rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:2px;display:block}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctxpanel input{flex:1 1 220px;min-width:0;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:4px 8px;font-size:.8rem}

.thread{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:min(760px,94%);min-width:0}
.msg.user{align-self:flex-end;background:var(--surface-2);border:1px solid var(--line);border-radius:12px 12px 2px 12px;padding:9px 12px;display:flex;flex-direction:column;gap:8px;white-space:pre-wrap;word-break:break-word}
.msg.user .imgs{display:flex;gap:6px;flex-wrap:wrap}
.msg.user img{max-width:220px;max-height:160px;border:1px solid var(--line);border-radius:6px;cursor:zoom-in;display:block}
.msg.user img.big{max-width:100%;max-height:none;cursor:zoom-out}
.msg.ai{align-self:flex-start;word-break:break-word}
.md > :first-child{margin-top:0} .md > :last-child{margin-bottom:0}
.md p{margin:.5em 0} .md ul,.md ol{margin:.5em 0;padding-left:1.4em} .md li{margin:.15em 0}
.md h3,.md h4,.md h5,.md h6{font-family:var(--display);margin:.9em 0 .3em;line-height:1.2}
.md h3{font-size:1.15rem} .md h4{font-size:1.05rem} .md h5,.md h6{font-size:.95rem}
.md code{font-size:.85em;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.md pre{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;margin:.6em 0}
.md pre code{background:none;border:0;padding:0;font-size:.8rem}
.md .tbl{overflow-x:auto;margin:.6em 0}
.md table{border-collapse:collapse;font-size:.85rem}
.md th,.md td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.md th{background:var(--surface-2)}
details.tool{align-self:flex-start;max-width:100%;min-width:0;font-family:var(--mono);font-size:.75rem;color:var(--ink-2);border-left:2px solid var(--line);padding:2px 9px}
details.tool summary{cursor:pointer;display:flex;gap:8px;align-items:baseline;list-style:none;min-width:0}
details.tool summary::-webkit-details-marker{display:none}
details.tool b{color:var(--ink);font-weight:600;flex:none}
details.tool .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
details.tool .r{flex:none;color:var(--ink-3)}
details.tool .r.err{color:var(--fail)} details.tool .r.run{color:var(--work)}
details.tool pre{margin:6px 0;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto;color:var(--ink)}
details.steps{align-self:flex-start;max-width:100%;min-width:0;font-size:.78rem;color:var(--ink-2);border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:4px 10px}
details.steps > summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;min-width:0}
details.steps > summary::-webkit-details-marker{display:none}
details.steps > summary::before{content:"\25B8";color:var(--ink-3);flex:none}
details.steps[open] > summary::before{content:"\25BE"}
details.steps > summary b{color:var(--ink);font-weight:600;flex:none}
details.steps > summary .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;font-family:var(--mono);font-size:.72rem}
details.steps > summary .r{flex:none;font-weight:600}
details.steps .r.err{color:var(--fail)} details.steps .r.run{color:var(--work)}
.steps-body{display:flex;flex-direction:column;gap:6px;padding:8px 0 4px}
details.peer{align-self:flex-end;max-width:min(760px,94%);min-width:0;border:1px dashed var(--ink-3);border-radius:10px;padding:6px 11px;font-size:.82rem;color:var(--ink-2)}
details.peer summary{cursor:pointer;display:flex;gap:8px;align-items:baseline;list-style:none;min-width:0}
details.peer summary::-webkit-details-marker{display:none}
details.peer summary b{color:var(--ink);font-weight:600;flex:none}
details.peer summary .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
details.peer[open] summary .t{display:none}
.peer-body{white-space:pre-wrap;word-break:break-word;padding-top:8px;color:var(--ink)}
.card{align-self:flex-start;max-width:min(680px,100%);border:1px solid color-mix(in srgb,var(--need) 55%,var(--line));background:color-mix(in srgb,var(--need) 8%,var(--surface));border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .k{font-family:var(--mono);font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--need);font-weight:600}
.card pre{margin:0;font-family:var(--mono);font-size:.8rem;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
.card .q{font-weight:600}
.card .opts{display:flex;flex-direction:column;gap:6px}
.card .opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.card .opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card .opt small{color:var(--ink-2)}
.card input[type=text]{border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:6px 9px;width:100%}
.note{align-self:flex-start;font-family:var(--mono);font-size:.72rem;color:var(--ink-3);padding:3px 9px;border-left:2px solid var(--line);word-break:break-word}
.typing{display:flex;align-items:center;gap:8px;color:var(--work);font-size:.8rem;font-weight:500;padding:0 16px 8px}

.composer{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px;position:relative}
.composer .line{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:9px 10px;min-height:40px;max-height:220px}
.composer.drag textarea{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.attach{display:flex;gap:6px;flex-wrap:wrap}
.attach .th{position:relative}
.attach img{width:56px;height:56px;object-fit:cover;border:1px solid var(--line);border-radius:6px;display:block}
.attach button{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:11px;line-height:1;cursor:pointer;padding:0}
.hint{font-size:.7rem;color:var(--ink-3)}
.mic{display:inline-flex;align-items:center;gap:6px}
.mic svg{width:14px;height:14px;display:block}
.mic.on{border-color:var(--fail);color:var(--fail);background:color-mix(in srgb,var(--fail) 10%,var(--surface))}
.mic.on svg{animation:pulse 1.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.mic.on svg{animation:none}}
.watchbar{flex-direction:row;align-items:center;gap:10px 14px;flex-wrap:wrap;background:var(--surface-2)}
.watchbar span{flex:1 1 320px;color:var(--ink-2);font-size:.85rem}
.cmds{position:absolute;left:12px;right:12px;bottom:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgb(0 0 0 / .18);max-height:240px;overflow:auto;padding:4px;z-index:5}
.cmds button{display:block;width:100%;text-align:left;border:0;background:transparent;font-family:var(--mono);font-size:.8rem;padding:5px 8px;border-radius:5px;cursor:pointer}
.cmds button:hover,.cmds button.on{background:var(--surface-2)}

.pane{flex:1;overflow-y:auto;padding:22px 20px;background:var(--surface-2);display:flex;flex-direction:column;gap:14px}
.pane h2{margin:0;font-family:var(--display);font-size:1.3rem}
.pane .sub{color:var(--ink-2);max-width:70ch}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;max-width:860px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:.75rem;font-weight:600;color:var(--ink-2);min-width:0}
.form input[type=text],.form select,.form textarea,.find{border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:7px 9px;min-width:0;width:100%;font-weight:400;color:var(--ink)}
.form .wide{grid-column:1 / -1}
.form .check{flex-direction:row;align-items:center;gap:8px;font-size:.85rem;font-weight:500;color:var(--ink)}
.form .fixed{font-family:var(--mono);font-size:.8rem;font-weight:500;color:var(--ink);padding:7px 0}
.err{color:var(--fail);font-weight:600}
.list{display:flex;flex-direction:column;gap:6px;max-width:860px}
.it{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.it .what{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:2px}
.it .what b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .what span{font-size:.75rem;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .when{font-family:var(--mono);font-size:.72rem;color:var(--ink-3);white-space:nowrap}
.it.pick{cursor:pointer}
.it.pick input{width:16px;height:16px;flex:none}
.it.pick .cs{font-family:var(--mono);font-weight:600;min-width:120px}
.it.pick .where{font-size:.75rem;color:var(--ink-2);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.85rem;z-index:20;max-width:90vw}

@media (max-width:760px){
  .body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .rail .grp{display:none}
  .row{width:auto;flex:none;grid-template-columns:auto auto;box-shadow:0 0 0 1px var(--line)}
  .row .last,.row .ago,.row .ctx{display:none}
  .row .cs{max-width:140px}
}
</style>
</head>
<body>
<div class="bar">
  <span class="name">Cockpit</span>
  <select id="project" aria-label="Project"></select>
  <button class="btn sm" id="btn-settings" type="button" title="Name, team notes and permissions of this project">Settings</button>
  <button class="btn sm" id="btn-project" type="button">+ Project</button>

</div>
<div class="body">
  <nav class="rail" id="rail" aria-label="Agents"></nav>
  <div class="main" id="main"></div>

<script>
'use strict';
const ST = { need: 'Needs you', review: 'Ready to review', work: 'Working', failed: 'Failed', idle: 'Idle' };
const ORDER = ['need', 'review', 'work', 'failed', 'idle'];
const MODES = { default: 'Ask before edits and commands', acceptEdits: 'Accept edits, ask for commands', auto: 'Auto: Claude Code judges each action itself', plan: 'Plan first, change nothing', dontAsk: 'Never ask: refuse what is not allowed in advance', bypassPermissions: 'Allow everything, never ask' };
const ALLOW_ALL_WARNING = 'With "Allow everything" an agent runs any command and changes or deletes any file without asking you first.\n\nWindows the cockpit opens start without Claude Code\'s own warning screen, because you confirm it here.';
const KCOL = ['var(--ink-2)', 'var(--review)', 'var(--work)', 'var(--need)', 'var(--done)', 'var(--ink-3)', 'var(--fail)'];

const S = { projects: [], agents: new Map(), items: new Map(), commands: new Map(), project: null, cur: null, view: 'chat',
  drafts: new Map(), attach: [], ctxOpen: false, ctx: new Map(), home: '', detail: false, preview: null };
const plain = t => String(t || '').replace(/[*`#]+/g, '').replace(/\s+/g, ' ').trim();
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

function h(tag, a, ...kids) {
  const e = document.createElement(tag);
  if (a) for (const [k, v] of Object.entries(a)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'hidden' || k === 'selected' || k === 'type' || k === 'id' || k === 'title' || k === 'placeholder' || k === 'rows' || k === 'open') e[k] = v;
    else e.setAttribute(k, v);

}
const $ = id => document.getElementById(id);
function toast(msg) { const t = h('div', { class: 'toast', text: msg }); document.body.append(t); setTimeout(() => t.remove(), Math.min(12000, 4200 + msg.length * 30)); }
async function api(method, url, body) {
  const res = await fetch(url, { method, headers: body ? { 'content-type': 'application/json' } : undefined, body: body ? JSON.stringify(body) : undefined });
  let data = {}; try { data = await res.json(); } catch {}
  if (!res.ok) { const e = new Error(data.error || `Request failed (${res.status})`); e.data = data; throw e; }
  return data;
}
function ago(ts) {
  if (!ts) return '';
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 45) return 'now'; if (s < 3600) return Math.round(s / 60) + ' min'; if (s < 86400) return Math.round(s / 3600) + ' h';
  return Math.round(s / 86400) + ' d';
}
function lvl(p) { return p >= 80 ? ' ctx-high' : p >= 60 ? ' ctx-warn' : ''; }
function meter(p) { return h('span', { class: 'ctx' + lvl(p), title: `Context ${p}%` }, h('i', { style: `width:${Math.min(100, p)}%` })); }
function pill(st, text) { return h('span', { class: 'pill s-' + st }, h('span', { class: 'dot' }), text || ST[st]); }
function teamOf(pid) { return [...S.agents.values()].filter(a => a.projectId === pid); }
function curAgent() { return S.agents.get(S.cur) || null; }
function curProject() { return S.projects.find(p => p.id === S.project) || null; }

// ───────── small, safe Markdown renderer ─────────
function md(src) {
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const inline = s => {
    s = esc(s); const codes = [];
    s = s.replace(/`([^`\n]+)`/g, (m, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[\s(])\*([^*\s][^*\n]*)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>');
    s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return s.replace(/\u0000(\d+)\u0000/g, (m, i) => '<code>' + codes[i] + '</code>');
  };
  const isList = l => /^\s*([-*]|\d+\.)\s+/.test(l), isRow = l => /^\s*\|.*\|\s*$/.test(l);
  const out = []; const lines = src.replace(/\r/g, '').split('\n'); let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^\s*```/.test(l)) { const buf = []; i++; while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]); i++; out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); continue; }
    const hd = /^(#{1,4})\s+(.*)$/.exec(l);
    if (hd) { const n = hd[1].length + 2; out.push(`<h${n}>${inline(hd[2])}</h${n}>`); i++; continue; }
    if (isRow(l) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => inline(c.trim()));
      const head = cells(l); i += 2; const rows = [];
      while (i < lines.length && isRow(lines[i])) rows.push(cells(lines[i++]));
      out.push('<div class="tbl"><table><thead><tr>' + head.map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>');
      continue;
    }
    if (isList(l)) {
      const ord = /^\s*\d+\./.test(l); const buf = [];
      while (i < lines.length && (isList(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && buf.length))) {
        if (isList(lines[i])) buf.push(inline(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, ''))); else buf[buf.length - 1] += '<br>' + inline(lines[i].trim());
        i++;
      }
      out.push((ord ? '<ol>' : '<ul>') + buf.map(b => `<li>${b}</li>`).join('') + (ord ? '</ol>' : '</ul>')); continue;
    }
    if (!l.trim()) { i++; continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^\s*```/.test(lines[i]) && !/^#{1,4}\s/.test(lines[i]) && !isList(lines[i])) buf.push(inline(lines[i++]));
    out.push('<p>' + buf.join('<br>') + '</p>');
  }
  return out.join('');
}

// ───────── top bar and roster ─────────
function renderBar() {
  const sel = $('project'); sel.textContent = '';
  if (!S.projects.length) sel.append(h('option', { text: 'No project yet', value: '' }));
  for (const p of S.projects) {
    const need = teamOf(p.id).filter(a => a.status === 'need').length;
    sel.append(h('option', { value: p.id, text: p.name + (need ? `  (${need} need you)` : ''), selected: p.id === S.project }));
  }
  const counts = $('counts'); counts.textContent = '';
  const team = teamOf(S.project);
  for (const s of ORDER) { const n = team.filter(a => a.status === s).length; if (n) counts.append(pill(s, `${n} ${ST[s].toLowerCase()}`)); }
  $('btn-new').disabled = $('btn-resume').disabled = $('btn-wake').disabled = $('btn-team').disabled = $('btn-settings').disabled = !S.project;
  const needAll = [...S.agents.values()].filter(a => a.status === 'need').length;
  document.title = (needAll ? `(${needAll}) ` : '') + 'Cockpit' + (curProject() ? ' · ' + curProject().name : '');

}
function renderRail() {
  const rail = $('rail'); rail.textContent = '';
  const team = teamOf(S.project);
  if (!team.length) { rail.append(h('div', { class: 'empty', text: S.project ? 'No agents in this project yet.' : 'Create a project to start.' })); return; }
  for (const s of ORDER) {
    const list = team.filter(a => a.status === s).sort((x, y) => (y.updatedAt || 0) - (x.updatedAt || 0));
    if (!list.length) continue;
    rail.append(h('div', { class: 'grp', text: `${ST[s]} · ${list.length}` }));
    for (const a of list) {
      rail.append(h('button', { class: 'row s-' + a.status, type: 'button', 'aria-current': a.id === S.cur && S.view === 'chat' ? 'true' : null, onclick: () => openAgent(a.id) },
        h('span', { class: 'dot' }), h('span', { class: 'cs', text: a.name }), h('span', { class: 'ago', text: (a.mode === 'watch' ? 'terminal · ' : '') + ago(a.updatedAt) }),
        h('span', { class: 'last', text: plain(a.last) }), a.ctx != null ? meter(a.ctx) : null));
    }
  }
}

// ───────── chat ─────────
let els = {}; // live DOM references for the open chat
function openAgent(id) {
  S.cur = id; S.view = 'chat'; S.attach = []; S.ctxOpen = false; S.preview = null;
  store.set('cockpit.agent.' + S.project, id);
  renderRail(); renderMain();
}
const loading = new Map();
function loadItems(id) {
  if (S.items.has(id)) return Promise.resolve();
  if (!loading.has(id)) loading.set(id, api('GET', `/api/agents/${id}/items`)
    .then(d => { S.items.set(id, d.items); S.commands.set(id, d.commands || []); })
    .finally(() => loading.delete(id)));
  return loading.get(id);
}
function renderMain() {
  if (S.micStop) S.micStop();
  const main = $('main'); main.textContent = ''; els = {};
  if (S.view === 'project' || !S.projects.length) return main.append(viewProject());
  if (S.view === 'new') return main.append(viewNew());
  if (S.view === 'settings' && curProject()) return main.append(viewSettings());
  if (S.view === 'team' && curProject()) return main.append(viewTeam());
  if (S.view === 'resume') return main.append(viewResume());
  const a = curAgent();
  if (!a) return main.append(viewEmpty());
  els.head = h('div', { class: 'head' });
  els.ctxpanel = h('div', { class: 'ctxpanel', hidden: true });
  els.thread = h('div', { class: 'thread' });
  els.typing = h('div', { class: 'typing s-work', hidden: true }, h('span', { class: 'dot' }), h('span'));
  els.preview = h('aside', { class: 'preview', hidden: true, 'aria-label': 'Preview' });
  main.append(els.head, els.ctxpanel, els.thread, els.typing, a.mode === 'watch' && !a.talk ? watchBar(a) : composer(a), els.preview);
  paintPreview();
  renderHead();
  const thread = els.thread;
  loadItems(a.id).then(() => { if (els.thread !== thread || !S.items.has(a.id)) return; thread.textContent = ''; for (const it of S.items.get(a.id)) if (!quietItem(it)) place(thread, renderItem(it, a), it); scrollDown(true); })
    .catch(e => els.thread.append(h('div', { class: 'note', text: 'Could not load the chat: ' + e.message })));
}
function renderHead() {
  const a = curAgent(); if (!a || !els.head) return;
  els.head.textContent = '';
  const watch = a.mode === 'watch';
  const mode = h('select', { title: watch ? 'Permissions used when the cockpit opens this agent in a terminal window' : 'Permission mode', 'aria-label': 'Permission mode', onchange: e => {
      if (e.target.value === 'bypassPermissions' && !confirm(`Allow everything for ${a.name}?\n\n${ALLOW_ALL_WARNING}` + (watch ? '\n\nIt applies the next time the cockpit opens its terminal window.' : ''))) { e.target.value = a.permissionMode; return; }
      api('POST', `/api/agents/${a.id}/settings`, { permissionMode: e.target.value }).catch(x => toast(x.message)); } },
    Object.entries(MODES).map(([k, v]) => h('option', { value: k, text: v, selected: a.permissionMode === k })));
  const p = curProject(); const sub = p && a.cwd !== p.cwd ? a.cwdShort : null;
  els.head.append(...[
    h('span', { class: 'cs', text: a.name, title: 'Click to rename', onclick: () => { const n = prompt('Agent name', a.name); if (n && n.trim()) api('POST', `/api/agents/${a.id}/settings`, { name: n.trim() }).catch(x => toast(x.message)); } }),
    pill(a.status),
    h('span', { class: 'meta', text: [sub, watch ? null : (a.modelResolved || a.model || 'default model'), a.login && !a.login.api ? a.login.label : null, a.cost ? '$' + a.cost.toFixed(2) : null].filter(Boolean).join(' · '), title: a.cwd }),
    a.login && a.login.api ? h('span', { class: 'pill s-failed', text: a.login.label, title: 'This agent is not using your Claude subscription' }) : null,
    watch ? h('span', { class: 'pill s-idle', text: a.window === 'closed' ? 'terminal window closed' : a.window === 'open' ? 'runs in its terminal window' : 'runs in a terminal', title: 'The cockpit shows this agent live but does not write to it' }) : null,
    mode,
    watch && a.talk && a.status === 'work' ? h('button', { class: 'btn sm', type: 'button', text: 'Interrupt', title: 'Press Esc in its terminal window: it stops what it is doing and waits for you', onclick: () => api('POST', `/api/agents/${a.id}/interrupt`).catch(x => toast(x.message)) }) : null,
    watch && a.window === 'open' ? h('button', { class: 'btn sm danger', type: 'button', text: 'Close window', title: 'Close its terminal window and stop the agent', onclick: () => stopTerm(a) }) : null,
    a.ctx != null ? h('button', { class: 'chip' + lvl(a.ctx), type: 'button', 'aria-expanded': String(S.ctxOpen), title: 'Show what fills the context', onclick: toggleCtx }, `Context ${a.ctx}%`, meter(a.ctx)) : null,
    !watch && a.interrupted ? h('button', { class: 'btn sm primary', type: 'button', text: 'Continue', title: 'It was interrupted when the cockpit stopped', onclick: () => send(a, 'Continue where you left off.', []) }) : null,
    !watch && a.status === 'review' ? h('button', { class: 'btn sm', type: 'button', text: 'Mark done', onclick: () => api('POST', `/api/agents/${a.id}/settings`, { status: 'idle' }).catch(x => toast(x.message)) }) : null,
    !watch && (a.status === 'work' || a.status === 'need') ? h('button', { class: 'btn sm danger', type: 'button', text: 'Stop', onclick: () => api('POST', `/api/agents/${a.id}/stop`).catch(x => toast(x.message)) }) : null,
    h('button', { class: 'btn sm', type: 'button', text: S.detail ? 'Group steps' : 'Show all steps', title: 'Fold commands, file reads and other tool calls into one line, or show each of them', onclick: () => { S.detail = !S.detail; store.set('cockpit.detail', S.detail ? '1' : ''); renderMain(); } }),
    a.window !== 'open' ? h('button', { class: 'btn sm primary', type: 'button', text: 'Open terminal', title: 'Open a terminal window for this agent. You then talk to it there or here.', onclick: () => openTerm(a) }) : null,
    h('button', { class: 'btn sm', type: 'button', text: 'Remove', title: 'Remove from the cockpit. The session stays on disk and can be resumed.', onclick: () => { if (confirm(`Remove ${a.name} from the cockpit?\nIts session stays on disk and can be resumed later.`)) api('DELETE', `/api/agents/${a.id}`).catch(x => toast(x.message)); } }),
  ].filter(Boolean));
  if (els.typing) { els.typing.hidden = a.status !== 'work'; els.typing.lastChild.textContent = `${a.name} is working`; }
}
function nearBottom() { const t = els.thread; return !t || t.scrollHeight - t.scrollTop - t.clientHeight < 140; }
function scrollDown(force) { const t = els.thread; if (t && (force || nearBottom())) t.scrollTop = t.scrollHeight; }

function renderItem(it, a) {
  let e;
  if (it.k === 'user') {
    e = h('div', { class: 'msg user' },
      it.images && it.images.length ? h('div', { class: 'imgs' }, it.images.map(im => h('img', { src: `data:${im.mediaType};base64,${im.data}`, alt: 'Attached image', onclick: ev => ev.target.classList.toggle('big') }))) : null,
      it.text ? h('span', { text: it.text }) : null);
  } else if (it.k === 'text') {
    e = h('div', { class: 'msg ai md', html: md(it.text || '') });
  } else if (isShowcase(it)) {
    const art = it.name === 'Artifact';
    const link = (/(https:\/\/claude\.ai\/[^\s"')]*artifact[^\s"')]*)/.exec(it.result || '') || [])[1];
    e = h('div', { class: 'files' }, it.files.map(f => fileCard({ ...f, link }, art ? 'Artifact' : 'File', art ? (it.input.title || f.name) : f.name, art ? it.input.description : it.input.caption)));
  } else if (it.k === 'tool') {
    const label = it.status === 'run' ? 'running' : it.status === 'err' ? 'failed' : '';
    e = h('details', { class: 'tool', 'data-label': stepLabel(it.name), 'data-status': it.status, 'data-sum': (it.summary || '').slice(0, 90) },
      h('summary', null, h('b', { text: stepLabel(it.name) }), h('span', { class: 't', text: it.summary || '' }), label ? h('span', { class: 'r ' + it.status, text: label }) : null),
      h('pre', { text: typeof it.input === 'string' ? it.input : JSON.stringify(it.input, null, 2) }),
      it.files ? h('div', { class: 'acts' }, it.files.map(f => h('button', { class: 'btn sm', type: 'button', text: 'Preview ' + f.name, onclick: () => openPreview(f) }))) : null,
      it.result ? h('pre', { text: it.result }) : null);
  } else if (it.k === 'peer') {
    e = h('details', { class: 'peer' },
      h('summary', null, h('b', { text: it.from ? `Message from ${it.from}` : 'Message from another agent' }), h('span', { class: 't', text: plain(it.text).slice(0, 200) })),
      h('div', { class: 'peer-body', text: it.text }));
  } else if (it.k === 'perm') {
    if (it.state !== 'pending') {
      const word = { allowed: 'Allowed', always: 'Always allowed', denied: 'Denied', cancelled: 'Cancelled' }[it.state] || it.state;
      e = h('div', { class: 'note', text: `${word} · ${it.toolName}: ${it.summary}` });
    } else {
      const decide = d => api('POST', `/api/agents/${a.id}/decision`, { id: it.id, decision: d }).catch(x => toast(x.message));
      e = h('div', { class: 'card' },
        h('span', { class: 'k', text: `${a.name} asks permission · ${it.toolName}` }),
        it.title ? h('span', { text: it.title }) : null,
        h('pre', { text: it.summary || JSON.stringify(it.input, null, 2) }),
        it.reason ? h('span', { class: 'hint', text: it.reason }) : null,
        h('details', null, h('summary', { class: 'hint', text: 'Full request' }), h('pre', { text: JSON.stringify(it.input, null, 2) })),
        h('div', { class: 'acts' },
          h('button', { class: 'btn primary', type: 'button', text: 'Allow once', onclick: () => decide('allow') }),
          it.canAlways ? h('button', { class: 'btn', type: 'button', text: 'Always allow this', onclick: () => decide('always') }) : null,
          h('button', { class: 'btn', type: 'button', text: 'Deny', onclick: () => decide('deny') })));
    }
  } else if (it.k === 'ask') {
    e = it.state === 'pending' ? askCard(it, a)
      : h('div', { class: 'note', text: it.state === 'answered' ? 'You answered · ' + Object.values(it.answers || {}).join(' · ') : 'Question cancelled' });
  } else {
    e = h('div', { class: 'note', text: it.text || '' });
  }

  return e;
}
function askCard(it, a) {
  const picks = it.questions.map(() => new Set()); const others = it.questions.map(() => '');
  const fast = it.questions.length === 1 && !it.questions[0].multiSelect;
  const submit = () => {
    const answers = {};
    it.questions.forEach((q, i) => { const v = [...picks[i]]; if (others[i].trim()) v.push(others[i].trim()); answers[q.question] = v.join(', '); });
    if (Object.values(answers).some(v => !v)) return toast('Please answer every question.');
    api('POST', `/api/agents/${a.id}/decision`, { id: it.id, decision: 'answer', answers }).catch(x => toast(x.message));
  };
  const card = h('div', { class: 'card' }, h('span', { class: 'k', text: `${a.name} asks` }));
  it.questions.forEach((q, i) => {
    const opts = h('div', { class: 'opts' });
    (q.options || []).forEach(o => {
      const b = h('button', { class: 'opt', type: 'button', 'aria-pressed': 'false' }, h('b', { text: o.label }), o.description ? h('small', { text: o.description }) : null);
      b.addEventListener('click', () => {
        if (q.multiSelect) { picks[i].has(o.label) ? picks[i].delete(o.label) : picks[i].add(o.label); }
        else { picks[i].clear(); picks[i].add(o.label); for (const x of opts.children) x.setAttribute('aria-pressed', 'false'); }
        b.setAttribute('aria-pressed', String(picks[i].has(o.label)));
        if (fast) submit();
      });
      opts.append(b);
    });
    card.append(h('span', { class: 'q', text: q.question }), opts,
      h('input', { type: 'text', placeholder: 'Or type your own answer', 'aria-label': 'Your own answer', oninput: e => { others[i] = e.target.value; }, onkeydown: e => { if (e.key === 'Enter') submit(); } }));
  });
  card.append(h('div', { class: 'acts' }, h('button', { class: 'btn primary', type: 'button', text: 'Send answer', onclick: submit })));
  return card;
}
// What an agent publishes or sends is shown as a card in the conversation, with a preview next to the chat.
function isShowcase(it) {
  return it.k === 'tool' && it.files && it.files.length && it.input &&
    ((it.name === 'Artifact' && (!it.input.action || it.input.action === 'publish')) || it.name === 'SendUserFile');
}
function fileCard(f, label, title, noteText) {
  return h('div', { class: 'file', role: 'button', tabindex: '0', title: 'Show ' + f.name + ' next to the chat',
    onclick: () => openPreview(f), onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPreview(f); } } },
